<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nixinbox - Temporary Disposable Mail</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between">
    <div class="max-w-3xl mx-auto px-4 py-8 w-full">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-500 tracking-wider">Nixinbox</h1>
            <p class="text-gray-400 text-sm mt-1">Fast, secure, and free temporary disposable email.</p>
        </header>

        <!-- Email Box -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg mb-6">
            <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2 font-semibold">Your Temporary Email Address</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="emailDisplay" readonly class="bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-white w-full select-all font-mono text-sm focus:outline-none" value="Generating email...">
                <div class="flex gap-2">
                    <button id="copyBtn" onclick="copyEmail()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-3 rounded-lg text-sm transition flex items-center justify-center gap-1">Copy</button>
                    <button id="refreshEmailBtn" onclick="generateEmail()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-3 rounded-lg text-sm transition">New</button>
                </div>
            </div>
        </div>

        <!-- Inbox Section -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-200">Inbox</h2>
                <button onclick="checkInbox()" class="text-xs text-blue-400 hover:underline flex items-center gap-1">🔄 Refresh Inbox</button>
            </div>
            <div id="inboxList" class="divide-y divide-gray-800 max-h-96 overflow-y-auto">
                <div class="text-center py-8 text-gray-500 text-sm">Waiting for incoming messages...</div>
            </div>
        </div>
    </div>

    <script>
        let currentEmail = "";
        let currentPassword = "";
        let token = "";

        async function generateEmail() {
            const display = document.getElementById("emailDisplay");
            display.value = "Generating email...";
            
            try {
                const domainRes = await fetch('https://api.mail.tm/domains');
                const domainData = await domainRes.json();
                const domains = domainData['hydra:member'] || domainData;
                if (!domains || domains.length === 0) throw new Error("Domain not found");
                const domain = domains[0].domain;

                const username = 'user_' + Math.random().toString(36).substring(2, 8);
                currentEmail = `${username}@${domain}`;
                currentPassword = Math.random().toString(36).substring(2, 10);

                const accRes = await fetch('https://api.mail.tm/accounts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: currentEmail, password: currentPassword })
                });

                if (!accRes.ok) throw new Error("Account creation failed");

                const tokenRes = await fetch('https://api.mail.tm/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: currentEmail, password: currentPassword })
                });

                const tokenData = await tokenRes.json();
                token = tokenData.token;

                display.value = currentEmail;
                document.getElementById("inboxList").innerHTML = `<div class="text-center py-8 text-gray-500 text-sm">Inbox is empty. Waiting for incoming messages...</div>`;
            } catch (err) {
                console.error(err);
                // Fallback taake app kabhi na atke
                currentEmail = `temp_${Math.floor(Math.random() * 90000 + 10000)}@mail.tm`;
                display.value = currentEmail;
                document.getElementById("inboxList").innerHTML = `<div class="text-center py-8 text-gray-500 text-sm">Offline fallback active. Click 'New' to retry.</div>`;
            }
        }

        async function checkInbox() {
            if (!token) {
                alert("Please generate an email first!");
                return;
            }
            const inboxList = document.getElementById("inboxList");
            inboxList.innerHTML = `<div class="text-center py-8 text-gray-500 text-sm">Checking inbox...</div>`;

            try {
                const res = await fetch('https://api.mail.tm/messages', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const messages = data['hydra:member'] || data;

                if (!messages || messages.length === 0) {
                    inboxList.innerHTML = `<div class="text-center py-8 text-gray-500 text-sm">No messages yet. Waiting...</div>`;
                } else {
                    inboxList.innerHTML = messages.map(m => `
                        <div class="py-3 px-2 hover:bg-gray-800/50 cursor-pointer transition flex justify-between items-center rounded">
                            <div>
                                <div class="text-sm font-medium text-white">From: ${m.from.address}</div>
                                <div class="text-xs text-gray-400 truncate max-w-xs">Subject: ${m.subject || '(No Subject)'}</div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                inboxList.innerHTML = `<div class="text-center py-8 text-gray-500 text-sm">Error loading messages.</div>`;
            }
        }

        function copyEmail() {
            const display = document.getElementById("emailDisplay");
            if (!currentEmail) return;
            navigator.clipboard.writeText(currentEmail);
            const btn = document.getElementById("copyBtn");
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = "Copy", 2000);
        }

        window.onload = generateEmail;
    </script>
</body>
</html>
