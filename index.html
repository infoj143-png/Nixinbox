<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nixinbox - Modern Temporary Disposable Mail</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">
    
    <div class="max-w-2xl mx-auto px-4 py-12 w-full">
        <!-- Header -->
        <header class="text-center mb-10">
            <div class="inline-block bg-blue-600/10 border border-blue-500/20 text-blue-400 text-xs font-semibold px-3 py-1 rounded-full mb-3">
                Secure & Anonymous
            </div>
            <h1 class="text-4xl font-black tracking-tight text-white mb-2">Nixinbox</h1>
            <p class="text-slate-400 text-sm">Instant disposable email for your signups, verifications, and spam protection.</p>
        </header>

        <!-- Email Generator Box -->
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 shadow-2xl mb-8">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Your Temporary Email Address</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="emailDisplay" readonly class="bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-3.5 text-blue-400 font-mono text-sm w-full select-all focus:outline-none shadow-inner" value="Loading email...">
                <div class="flex gap-2">
                    <button id="copyBtn" onclick="copyEmail()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-medium px-5 py-3.5 rounded-xl text-sm transition-all shadow-lg shadow-blue-600/20 flex items-center justify-center gap-1.5 cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        Copy
                    </button>
                    <button onclick="generateEmail()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-medium px-4 py-3.5 rounded-xl text-sm transition-all border border-slate-700 cursor-pointer" title="Generate New Email">
                        New
                    </button>
                </div>
            </div>
            <p class="text-xs text-slate-500 mt-3 flex items-center gap-1">
                <span>🔒</span> This email remains active until you click "New". Safe to leave for verifications!
            </p>
        </div>

        <!-- Inbox Section -->
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-5">
                <div class="flex items-center gap-2">
                    <h2 class="text-lg font-bold text-white">Inbox</h2>
                    <span id="msgCount" class="bg-blue-500/10 text-blue-400 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-blue-500/20">0</span>
                </div>
                <button onclick="checkInbox()" class="text-xs text-blue-400 hover:text-blue-300 font-medium bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/20 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 cursor-pointer">
                    🔄 Refresh
                </button>
            </div>
            
            <div id="inboxList" class="divide-y divide-slate-800/60 max-h-[380px] overflow-y-auto pr-1">
                <div class="text-center py-12 text-slate-500 text-sm">
                    <div class="text-3xl mb-2">📭</div>
                    Waiting for incoming messages...
                </div>
            </div>
        </div>
    </div>

    <!-- Message Detail Modal -->
    <div id="messageModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-8 h-8 rounded-full flex items-center justify-center transition">&times;</button>
            <div class="mb-4 pr-6">
                <span id="modalSender" class="text-xs font-semibold text-blue-400 block mb-1"></span>
                <h3 id="modalSubject" class="text-xl font-bold text-white"></h3>
            </div>
            <div id="modalBody" class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-slate-300 text-sm max-h-64 overflow-y-auto mb-4 font-sans"></div>
            <button onclick="closeModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-2.5 rounded-xl text-sm transition">Close</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-600 border-t border-slate-900">
        Powered by Secure Proxy &bull; Hosted on Vercel
    </footer>

    <!-- JavaScript Logic with CORS Proxy Integration -->
    <script>
        let currentEmail = localStorage.getItem('nixinbox_email') || "";
        let login = "";
        let domain = "";
        const CORS_PROXY = "https://corsproxy.io/?";

        window.onload = async () => {
            if (currentEmail) {
                parseEmail(currentEmail);
                document.getElementById("emailDisplay").value = currentEmail;
                checkInbox();
            } else {
                await generateEmail();
            }
            setInterval(checkInbox, 10000);
        };

        function parseEmail(email) {
            const parts = email.split('@');
            if (parts.length === 2) {
                login = parts[0];
                domain = parts[1];
            }
        }

        async function generateEmail() {
            const display = document.getElementById("emailDisplay");
            display.value = "Generating new email...";
            
            try {
                const targetUrl = encodeURIComponent('https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1');
                const res = await fetch(CORS_PROXY + targetUrl);
                if (!res.ok) throw new Error("Proxy response failed");
                
                const data = await res.json();
                if (!data || data.length === 0) throw new Error("Generation failed");
                
                currentEmail = data[0];
                parseEmail(currentEmail);
                
                localStorage.setItem('nixinbox_email', currentEmail);

                display.value = currentEmail;
                document.getElementById("inboxList").innerHTML = `<div class="text-center py-12 text-slate-500 text-sm"><div class="text-3xl mb-2">📭</div>Inbox is empty. Waiting for code...</div>`;
                document.getElementById("msgCount").innerText = "0";
            } catch (err) {
                console.error("Error:", err);
                display.value = "Error generating email. Click New.";
            }
        }

        async function checkInbox() {
            if (!login || !domain) return;
            
            try {
                const targetUrl = encodeURIComponent(`https://www.1secmail.com/api/v1/?action=getMessages&login=${login}&domain=${domain}`);
                const res = await fetch(CORS_PROXY + targetUrl);
                if (!res.ok) return;

                const messages = await res.json();
                document.getElementById("msgCount").innerText = messages.length;

                const inboxList = document.getElementById("inboxList");
                if (!messages || messages.length === 0) return;

                inboxList.innerHTML = messages.map(m => `
                    <div onclick="readMessage('${m.id}')" class="py-3 px-3 hover:bg-slate-800/50 cursor-pointer transition flex justify-between items-center rounded-xl my-1 group">
                        <div class="pr-2">
                            <div class="text-sm font-semibold text-white group-hover:text-blue-400 transition">${m.from}</div>
                            <div class="text-xs text-slate-400 truncate max-w-xs">${m.subject || '(No Subject)'}</div>
                        </div>
                        <div class="text-xs text-slate-500 whitespace-nowrap">${m.date}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        async function readMessage(id) {
            try {
                const targetUrl = encodeURIComponent(`https://www.1secmail.com/api/v1/?action=readMessage&login=${login}&domain=${domain}&id=${id}`);
                const res = await fetch(CORS_PROXY + targetUrl);
                const msg = await res.json();
                
                document.getElementById('modalSubject').innerText = msg.subject || 'No Subject';
                document.getElementById('modalSender').innerText = `From: ${msg.from}`;
                
                const bodyContainer = document.getElementById('modalBody');
                if (msg.htmlBody && msg.htmlBody.length >0) {
                    bodyContainer.innerHTML = `<iframe srcdoc="${msg.htmlBody.replace(/"/g, '&quot;')}" class="w-full h-48 bg-white rounded-lg border-0"></iframe>`;
                } else {
                    bodyContainer.innerText = msg.textBody || msg.body || 'Empty message body';
                }

                document.getElementById('messageModal').classList.remove('hidden');
            } catch (err) {
                console.error(err);
            }
        }

        function closeModal() {
            document.getElementById('messageModal').classList.add('hidden');
        }

        function copyEmail() {
            const display = document.getElementById("emailDisplay");
            if (!currentEmail) return;
            display.select();
            navigator.clipboard.writeText(currentEmail);
            const btn = document.getElementById("copyBtn");
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `✓ Copied!`;
            btn.classList.add("bg-emerald-600");
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove("bg-emerald-600");
            }, 2000);
        }
    </script>
</body>
</html>
